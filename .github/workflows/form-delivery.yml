name: Retry sales enquiry notifications

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: form-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retry persisted contact and RFQ notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Set the CRON_SECRET repository secret before activating retries."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 55 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://www.somnyxsolar.com/api/cron/form-delivery
